name: site

# Builds the website from the database, checks it, and publishes it to GitHub Pages.
# Pull requests build and check the site without publishing it. Pushes to main publish it.
# The release workflow starts it after each release, so the site shows the new version.
# The same steps run locally with: Rscript site/build_site.R, then Rscript tests/check_site.R
on:
  push:
    branches: [main]
    paths: ["db/**", "site/**", "www/**", "tests/**", "VERSION", ".github/workflows/site.yml", ".github/workflows/check-db.yml"]
  pull_request:
    paths: ["db/**", "site/**", "www/**", "tests/**", "VERSION", ".github/workflows/site.yml", ".github/workflows/check-db.yml"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Nothing is built unless the database passes the checks
  check:
    uses: ./.github/workflows/check-db.yml

  build:
    needs: check
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: "4.4"
          use-public-rspm: true

      - name: Install RSQLite
        run: Rscript -e 'install.packages("RSQLite")'

      - name: Build the website
        run: Rscript site/build_site.R

      - name: Check the website
        run: Rscript tests/check_site.R

      - uses: actions/upload-pages-artifact@v3
        if: github.event_name != 'pull_request'
        with:
          path: _site

  deploy:
    needs: build
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
