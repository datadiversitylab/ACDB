name: site

# Builds the static pages from the database and publishes them to GitHub Pages.
# It runs when the data, the site files, or the version change, and from the Actions tab.
# The same build runs locally with: Rscript site/build_site.R
on:
  push:
    branches: [main]
    paths: ["db/**", "site/**", "www/**", "VERSION", ".github/workflows/site.yml"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  check:
    uses: ./.github/workflows/check-db.yml

  build:
    needs: check
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: "4.4"
          use-public-rspm: true

      - name: Install RSQLite
        run: Rscript -e 'install.packages("RSQLite")'

      - name: Build the pages
        run: Rscript site/build_site.R

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
